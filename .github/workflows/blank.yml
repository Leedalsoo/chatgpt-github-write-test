name: Save AI Review

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Markdown filename"
        required: true
      content:
        description: "Markdown content"
        required: true

permissions:
  contents: write

jobs:
  save-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Save review
        env:
          FILENAME: ${{ inputs.filename }}
          CONTENT: ${{ inputs.content }}
        run: |
          mkdir -p docs/ai-review
          printf '%s' "$CONTENT" > "docs/ai-review/$FILENAME"

      - name: Commit review
        run: |
          git config user.name "AI Review Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-review
          git commit -m "docs: save AI review"
          git push
